  # ── Panchangam ────────────────────────────────────────────────────────────

  /api/panchangam/daily:
    post:
      tags: [Panchangam]
      summary: Daily panchangam — tithi, nakshatra, yoga, karana, rahu kalam
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PanchangamRequest' }
            example:
              date: "2026-06-04"
              latitude: 13.0827
              longitude: 80.2707
              timezone: Asia/Kolkata
              lang: ta
      responses:
        '200':
          description: Daily panchangam data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  cached:  { type: boolean, example: false, description: "true = Redis cache hit (24h TTL)" }
                  data:    { $ref: '#/components/schemas/PanchangamData' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/panchangam/detailed:
    post:
      tags: [Panchangam]
      summary: Detailed panchangam — lagna timings, muhurtham windows, varasoolai
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PanchangamRequest' }
            example:
              date: "2026-06-04"
              latitude: 13.0827
              longitude: 80.2707
              timezone: Asia/Kolkata
      responses:
        '200':
          description: Detailed panchangam data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  cached:  { type: boolean, example: false }
                  data:
                    allOf:
                      - $ref: '#/components/schemas/PanchangamData'
                      - type: object
                        properties:
                          lagna_timings:
                            type: array
                            items:
                              type: object
                              properties:
                                rasi:  { type: string, example: Aries }
                                start: { type: string, example: "05:58" }
                                end:   { type: string, example: "08:10" }
                          muhurtham_timings:
                            type: array
                            items:
                              type: object
                              properties:
                                name:    { type: string, example: Abhijit }
                                start:   { type: string, example: "11:52" }
                                end:     { type: string, example: "12:44" }
                                quality: { type: string, example: Excellent }
                          varasoolai: { type: string, example: North }
                          nethram:    { type: string, example: East }
                          jeevan:     { type: string, example: South }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ── Muhurtham ─────────────────────────────────────────────────────────────

  /api/muhurtham/find:
    post:
      tags: [Muhurtham]
      summary: Find auspicious dates and times for an occasion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MuhurthamRequest' }
            examples:
              marriage:
                summary: Marriage muhurtham
                value:
                  start_date: "2026-07-01"
                  end_date: "2026-08-31"
                  occasion: marriage
                  latitude: 13.0827
                  longitude: 80.2707
                  timezone: Asia/Kolkata
                  lang: ta
              house_warming:
                summary: Gruhapravesam
                value:
                  start_date: "2026-07-01"
                  end_date: "2026-07-31"
                  occasion: house_warming
                  latitude: 13.0827
                  longitude: 80.2707
                  timezone: Asia/Kolkata
      responses:
        '200':
          description: Auspicious muhurtham slots
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:  { type: boolean, example: true }
                  occasion: { type: string,  example: marriage }
                  total:    { type: integer, example: 5 }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MuhurthamSlot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ── Matchmaking ───────────────────────────────────────────────────────────

  /api/matchmaking:
    get:
      tags: [Matchmaking]
      summary: Porutham by nakshatra index — public endpoint, no auth required
      security: []
      parameters:
        - name: boyNakshatra
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 26
          example: 4
          description: "Boy's nakshatra index (0 = Ashwini … 26 = Revati)"
        - name: girlNakshatra
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 26
          example: 15
          description: "Girl's nakshatra index (0 = Ashwini … 26 = Revati)"
      responses:
        '200':
          description: Porutham result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    allOf:
                      - $ref: '#/components/schemas/PoruthamResult'
                      - type: object
                        properties:
                          rajjuDosha:     { type: boolean, example: false }
                          summaryTamil:   { type: string }
                          summaryEnglish: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ── PDF ───────────────────────────────────────────────────────────────────

  /api/pdf/horoscope:
    post:
      tags: [PDF]
      summary: Generate and download full horoscope as PDF
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChartRequest' }
            example:
              date_of_birth: "1990-06-15"
              time_of_birth: "06:30"
              latitude: 13.0827
              longitude: 80.2707
              timezone: Asia/Kolkata
              name: Ravi
              lang: ta
      responses:
        '200':
          description: PDF file download
          headers:
            Content-Disposition:
              schema: { type: string }
              example: 'attachment; filename="AstroJyothi_Ravi.pdf"'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
