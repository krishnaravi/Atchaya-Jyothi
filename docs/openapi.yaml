  /api/dasa/porutham:
    post:
      tags: [Dasa]
      summary: Porutham by nakshatra index (0–26)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DasaPoruthamRequest' }
            examples:
              good_match:
                summary: Rohini × Swati (Good Match)
                value: { boy_nakshatra: 4, girl_nakshatra: 15 }
              excellent:
                summary: Rohini × Rohini (Excellent Match)
                value: { boy_nakshatra: 4, girl_nakshatra: 4 }
      responses:
        '200':
          description: Porutham result
          content:
            application/json:
              schema:
                type: object
                properties:
